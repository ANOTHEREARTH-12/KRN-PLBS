<body>
<div class="app"><aside class="side" id="side"></aside><main class="main" id="main"></main></div>
<div id="modal"></div><div id="toast"></div>
<script>
'use strict';
/* ================= helpers ================= */
const KEY='krn_plbs_v1';const FIRM='KRN Tax Consultancy';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{if(typeof v==='number')return isFinite(v)?Math.round(v):0;const n=parseFloat(String(v==null?'':v).replace(/[,₹\s]/g,''));return isFinite(n)?Math.round(n):0;};
const dnum=v=>{const n=parseFloat(v);return isFinite(n)?n:0;};
const inr=n=>(Math.round(n)||0).toLocaleString('en-IN');
const money=n=>n<0?'('+inr(-n)+')':inr(n);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sum=a=>(a||[]).reduce((s,r)=>s+num(r.v),0);
const getPath=(o,p)=>p.split('.').reduce((x,k)=>x==null?x:x[k],o);
const setPath=(o,p,v)=>{const k=p.split('.');let x=o;for(let i=0;i<k.length-1;i++)x=x[k[i]];x[k[k.length-1]]=v;};
const ENTITY=['Proprietorship','Partnership','LLP','Company'];
const kindOf=c=>c.type==='Company'?'co':(c.type==='Partnership'||c.type==='LLP')?'firm':'prop';

/* ---- financial year helpers ---- */
const curFYStart=()=>{const d=new Date();return d.getMonth()>=3?d.getFullYear():d.getFullYear()-1;};
const fyFrom=y=>y+'-'+String((y+1)%100).padStart(2,'0');
const fyStart=fy=>parseInt(fy.slice(0,4),10);
const nextFY=fy=>fyFrom(fyStart(fy)+1), prevFY=fy=>fyFrom(fyStart(fy)-1);
const fyEndText=fy=>'31st March '+(fyStart(fy)+1);
const fyList=()=>{const a=[];for(let y=2012;y<=curFYStart()+1;y++)a.push(fyFrom(y));return a.reverse();};
const defaultFY=()=>fyFrom(curFYStart()-1);
function normFY(s){s=String(s||'');let m=/(\d{4})\s*[-–\/]\s*(\d{2,4})/.exec(s)||/(\d{4})/.exec(s);if(!m)return'';const y=+m[1];return(y>=2000&&y<=2100)?fyFrom(y):'';}

/* ================= storage ================= */
let memOnly=false;
function loadDB(){try{const s=localStorage.getItem(KEY);if(s){const d=JSON.parse(s);if(d&&Array.isArray(d.clients)){d.settings=d.settings||{firm:FIRM};if(!d.settings.firm)d.settings.firm=FIRM;return d;}}}catch(e){memOnly=true;}return{clients:[],settings:{firm:FIRM}};}
let DB=loadDB(),saveT=null;
function saveNow(){try{localStorage.setItem(KEY,JSON.stringify(DB));memOnly=false;setInd('Saved locally ✓ '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));}catch(e){memOnly=true;setInd('⚠ Not saved (storage blocked) – take a backup');}}
function save(){setInd('Saving…');clearTimeout(saveT);saveT=setTimeout(saveNow,250);}
function setInd(t){const e=$('#saveind');if(e)e.textContent=t;}

/* ================= state ================= */
const UI={view:'clients',cid:null,fy:null,ret:null,q:'',ft:'',opt:{inc:'all',orient:'p',sig:true}};
let FORM=null;
const curClient=()=>DB.clients.find(c=>c.id===UI.cid)||null;
const curYear=()=>{const c=curClient();return c&&UI.fy?c.years[UI.fy]||null:null;};
const latestFY=c=>Object.keys(c.years).sort().pop()||null;

/* ================= data model ================= */
const asset=(n,rate)=>({n,rate,open:0,addFull:0,addHalf:0,disposal:0});
function blankYear(fy,c){
  return{fy,done:false,exports:0,created:Date.now(),
    trading:{openStock:0,purchases:0,sales:0,closingStock:0,direct:[{n:'Freight & Carriage',v:0},{n:'Wages',v:0}]},
    pl:{indirect:[{n:'Salaries',v:0},{n:'Rent',v:0},{n:'Office Expenses',v:0},{n:'Interest on Loan',v:0}],
        income:c.hasTrading?[{n:'Interest Received',v:0}]:[{n:'Professional Fees / Service Receipts',v:0},{n:'Interest Received',v:0}]},
    bs:{openCapital:0,drawings:0,shareCapital:0,openSurplus:0,dividend:0,interestRate:0,
        partners:kindOf(c)==='firm'?[{name:'',ratio:50,openCapital:0,drawings:0,remuneration:0},{name:'',ratio:50,openCapital:0,drawings:0,remuneration:0}]:[],
        secured:0,unsecured:0,creditors:0,taxes:0,otherLiab:[],
        debtors:0,cash:0,banks:[{n:'Bank Account',v:0}],advances:0,otherAssets:[],
        assets:[asset('Furniture & Fixtures',10),asset('Computers',40),asset('Plant & Machinery',15)],
        autoBalance:false}};
}

/* ================= calculations ================= */
function compute(c,y){
  const kind=kindOf(c),t=y.trading,b=y.bs,hasT=!!c.hasTrading;
  const direct=hasT?sum(t.direct):0;
  const gp=hasT?(num(t.sales)+num(t.closingStock))-(num(t.openStock)+num(t.purchases)+direct):0;
  const fa=(b.assets||[]).map(a=>{
    const r=dnum(a.rate)/100,full=Math.max(num(a.open)+num(a.addFull)-num(a.disposal),0);
    const dep=Math.round(full*r+num(a.addHalf)*r/2);
    const total=num(a.open)+num(a.addFull)+num(a.addHalf)-num(a.disposal);
    return{dep,close:total-dep,total};});
  const dep=fa.reduce((s,x)=>s+x.dep,0),faClose=fa.reduce((s,x)=>s+x.close,0);
  const indirect=sum(y.pl.indirect),income=sum(y.pl.income);
  const np=gp+income-indirect-dep;
  const o={kind,gp,direct,fa,dep,faClose,indirect,income,np,partners:[],noRatio:false};
  if(kind==='prop'){o.capClose=num(b.openCapital)+np-num(b.drawings);o.capTotal=o.capClose;}
  else if(kind==='firm'){
    const P=b.partners||[],rate=dnum(b.interestRate);
    const ints=P.map(p=>Math.round(num(p.openCapital)*rate/100)),rems=P.map(p=>num(p.remuneration));
    const ti=ints.reduce((s,x)=>s+x,0),tr=rems.reduce((s,x)=>s+x,0),pool=np-ti-tr;
    const rs=P.reduce((s,p)=>s+Math.max(dnum(p.ratio),0),0);
    let shares=P.map(()=>0);
    if(rs>0&&P.length){shares=P.map(p=>Math.round(pool*Math.max(dnum(p.ratio),0)/rs));shares[P.length-1]+=pool-shares.reduce((s,x)=>s+x,0);}else if(P.length)o.noRatio=true;
    o.partners=P.map((p,i)=>({name:p.name||('Partner '+(i+1)),open:num(p.openCapital),int:ints[i],rem:rems[i],share:shares[i],draw:num(p.drawings),
      close:num(p.openCapital)+ints[i]+rems[i]+shares[i]-num(p.drawings)}));
    o.ti=ti;o.tr=tr;o.pool=pool;o.capTotal=o.partners.reduce((s,p)=>s+p.close,0);
  }else{o.surplusClose=num(b.openSurplus)+np-num(b.dividend);o.capTotal=num(b.shareCapital)+o.surplusClose;}
  const liabOther=num(b.secured)+num(b.unsecured)+num(b.creditors)+num(b.taxes)+sum(b.otherLiab);
  const stock=hasT?num(t.closingStock):0;
  o.stock=stock;o.bankTotal=sum(b.banks);
  const tl=o.capTotal+liabOther,ta=faClose+stock+num(b.debtors)+num(b.cash)+o.bankTotal+num(b.advances)+sum(b.otherAssets);
  const diff=ta-tl;o.diff=diff;o.susL=0;o.susA=0;
  if(b.autoBalance){if(diff>0)o.susL=diff;else if(diff<0)o.susA=-diff;}
  o.totalLiab=tl+o.susL;o.totalAssets=ta+o.susA;o.balanced=diff===0;
  return o;
}

/* carry forward closing balances of year p into a new year */
function carry(c,p,newFY){
  const m=compute(c,p),y=blankYear(newFY,c),b=y.bs,pb=p.bs,kind=kindOf(c);
  y.trading.openStock=c.hasTrading?num(p.trading.closingStock):0;
  y.trading.closingStock=c.hasTrading?num(p.trading.closingStock):0;
  y.trading.direct=p.trading.direct.map(r=>({n:r.n,v:0}));
  y.pl.indirect=p.pl.indirect.map(r=>({n:r.n,v:0}));
  y.pl.income=p.pl.income.map(r=>({n:r.n,v:0}));
  if(kind==='prop')b.openCapital=m.capClose;
  else if(kind==='firm'){b.interestRate=pb.interestRate;b.partners=m.partners.map((x,i)=>({name:pb.partners[i].name,ratio:pb.partners[i].ratio,openCapital:x.close,drawings:0,remuneration:x.rem}));}
  else{b.shareCapital=pb.shareCapital;b.openSurplus=m.surplusClose;}
  ['secured','unsecured','creditors','taxes','debtors','cash','advances'].forEach(k=>b[k]=num(pb[k]));
  b.otherLiab=pb.otherLiab.map(r=>({n:r.n,v:num(r.v)}));
  b.banks=pb.banks.map(r=>({n:r.n,v:num(r.v)}));
  b.otherAssets=pb.otherAssets.map(r=>({n:r.n,v:num(r.v)}));
  b.assets=pb.assets.map((a,i)=>({n:a.n,rate:a.rate,open:m.fa[i].close,addFull:0,addHalf:0,disposal:0}));
  b.autoBalance=!!pb.autoBalance;y.carriedFrom=p.fy;
  return y;
}

/* ================= statements (shared by preview + PDF) ================= */
function pair(L,R,hl,hr){
  const n=Math.max(L.length,R.length),rows=[];
  for(let i=0;i<n;i++)rows.push({L:L[i]||null,R:R[i]||null});
  return{rows,tl:L.reduce((s,r)=>s+r.a,0),tr:R.reduce((s,r)=>s+r.a,0),hl:hl||'Particulars',hr:hr||'Particulars'};
}
function statements(c,y){
  const m=compute(c,y),kind=m.kind,b=y.bs,t=y.trading,S={m,kind,tables:[]};
  const row=(l,a,o)=>Object.assign({l,a},o||{});
  const nz=a=>(a||[]).filter(r=>num(r.v)!==0);
  const dest=kind==='prop'?'Capital A/c':kind==='firm'?'Appropriation A/c':'Reserves & Surplus';
  /* Trading */
  if(c.hasTrading){
    const L=[row('To Opening Stock',num(t.openStock)),row('To Purchases',num(t.purchases))],R=[row('By Sales',num(t.sales)),row('By Closing Stock',num(t.closingStock))];
    nz(t.direct).forEach(r=>L.push(row('To '+(r.n||'Direct Expenses'),num(r.v))));
    if(m.gp>=0)L.push(row('To Gross Profit c/d',m.gp,{b:1}));else R.push(row('By Gross Loss c/d',-m.gp,{b:1}));
    S.trading=pair(L,R);
  }
  /* P&L */
  {const L=[],R=[];
   if(c.hasTrading){if(m.gp>=0)R.push(row('By Gross Profit b/d',m.gp));else L.push(row('To Gross Loss b/d',-m.gp));}
   nz(y.pl.indirect).forEach(r=>L.push(row('To '+(r.n||'Expenses'),num(r.v))));
   if(m.dep)L.push(row('To Depreciation',m.dep));
   nz(y.pl.income).forEach(r=>R.push(row('By '+(r.n||'Income'),num(r.v))));
   if(m.np>=0)L.push(row('To Net Profit transferred to '+dest,m.np,{b:1}));else R.push(row('By Net Loss transferred to '+dest,-m.np,{b:1}));
   S.pl=pair(L,R);}
  /* Appropriation (partnership / LLP) */
  if(kind==='firm'&&m.partners.length){
    const L=[],R=[];
    if(m.np>=0)R.push(row('By Net Profit b/d',m.np,{b:1}));else L.push(row('To Net Loss b/d',-m.np,{b:1}));
    m.partners.forEach(p=>{if(p.int)L.push(row('To Interest on Capital – '+p.name,p.int));});
    m.partners.forEach(p=>{if(p.rem)L.push(row('To Remuneration – '+p.name,p.rem));});
    m.partners.forEach(p=>{if(p.share>=0)L.push(row('To '+p.name+' – Share of Profit',p.share));else R.push(row('By '+p.name+' – Share of Loss',-p.share));});
    S.appr=pair(L,R);
  }
  /* Balance sheet */
  {const L=[],R=[];
   if(kind==='prop'){
     L.push(row('Capital Account – Opening Balance',num(b.openCapital)));
     L.push(row(m.np>=0?'Add: Net Profit for the year':'Less: Net Loss for the year',m.np));
     if(num(b.drawings))L.push(row('Less: Drawings',-num(b.drawings)));
   }else if(kind==='firm'){
     m.partners.forEach(p=>L.push(row("Partner's Capital A/c – "+p.name,p.close)));
   }else{
     L.push(row('Share Capital',num(b.shareCapital)));
     L.push(row('Reserves & Surplus – Opening',num(b.openSurplus)));
     L.push(row(m.np>=0?'Add: Net Profit for the year':'Less: Net Loss for the year',m.np));
     if(num(b.dividend))L.push(row('Less: Dividend',-num(b.dividend)));
   }
   [['Secured Loans',b.secured],['Unsecured Loans',b.unsecured],['Sundry Creditors',b.creditors],['Duties & Taxes',b.taxes]].forEach(x=>{if(num(x[1]))L.push(row(x[0],num(x[1])));});
   nz(b.otherLiab).forEach(r=>L.push(row(r.n||'Other Liabilities',num(r.v))));
   if(m.susL)L.push(row('Difference / Suspense A/c',m.susL));
   if(m.faClose)R.push(row('Fixed Assets (as per Schedule)',m.faClose));
   if(c.hasTrading&&m.stock)R.push(row('Closing Stock',m.stock));
   if(num(b.debtors))R.push(row('Sundry Debtors',num(b.debtors)));
   if(num(b.cash))R.push(row('Cash in Hand',num(b.cash)));
   nz(b.banks).forEach(r=>R.push(row('Bank – '+(r.n||'Account'),num(r.v))));
   if(num(b.advances))R.push(row('Loans & Advances',num(b.advances)));
   nz(b.otherAssets).forEach(r=>R.push(row(r.n||'Other Assets',num(r.v))));
   if(m.susA)R.push(row('Difference / Suspense A/c',m.susA));
   S.bs=pair(L,R,'Liabilities','Assets');}
  /* schedules */
  if(kind==='firm'&&m.partners.length){
    const P=m.partners,line=(l,k,bold)=>[l].concat(P.map(p=>money(p[k]))).concat([money(P.reduce((s,p)=>s+p[k],0))]);
    S.tables.push({title:"Partners' Capital Accounts",head:['Particulars'].concat(P.map(p=>p.name),['Total']),
      rows:[line('Opening Balance','open'),line('Add: Interest on Capital','int'),line('Add: Remuneration','rem'),line('Add/(Less): Share of Profit/(Loss)','share'),
            ['Less: Drawings'].concat(P.map(p=>money(-p.draw)),[money(-P.reduce((s,p)=>s+p.draw,0))]),line('Closing Balance','close')],boldLast:true});
  }
  if(b.assets.some((a,i)=>m.fa[i].total||num(a.open))){
    const A=b.assets,rows=[];let T=[0,0,0,0,0,0];
    A.forEach((a,i)=>{const f=m.fa[i];if(!(num(a.open)||num(a.addFull)||num(a.addHalf)||num(a.disposal)))return;
      const v=[num(a.open),num(a.addFull),num(a.addHalf),num(a.disposal),f.dep,f.close];v.forEach((x,j)=>T[j]+=x);
      rows.push([a.n||'Asset',dnum(a.rate)+'%'].concat(v.map(money)));});
    rows.push(['Total',''].concat(T.map(money)));
    S.tables.push({title:'Schedule of Fixed Assets & Depreciation (WDV)',head:['Asset','Rate','Opening WDV','Add (≥180 days)','Add (<180 days)','Sale / Deletion','Depreciation','Closing WDV'],rows,boldLast:true});
  }
  return S;
}

/* ---------- PDF export ---------- */
function buildPDF(c,y){
  const J=window.jspdf&&window.jspdf.jsPDF;if(!J)return null;
  const doc=new J({orientation:UI.opt.orient==='l'?'landscape':'portrait',unit:'mm',format:'a4'});
  if(typeof doc.autoTable!=='function')return null;
  const S=statements(c,y),W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight(),mx=12,aw=W-2*mx,end=fyEndText(y.fy);
  const head=title=>{
    doc.setFont('helvetica','bold');doc.setFontSize(15);doc.setTextColor(20);doc.text((c.name||'').toUpperCase(),W/2,16,{align:'center'});
    doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(90);
    const a=doc.splitTextToSize((c.address||'')+(c.pan?'   |   PAN: '+c.pan:''),aw);doc.text(a,W/2,21.5,{align:'center'});
    const yy=21.5+a.length*4;doc.setFont('helvetica','bold');doc.setFontSize(10.5);doc.setTextColor(20);doc.text(title,W/2,yy+3,{align:'center'});return yy+8;};
  const sub=(t,yy)=>{if(yy>H-45){doc.addPage();yy=18;}doc.setFont('helvetica','bold');doc.setFontSize(9.5);doc.setTextColor(40);doc.text(t,W/2,yy,{align:'center'});return yy+2.5;};
  const tee=(s,yy)=>{
    const body=s.rows.map(r=>[r.L?r.L.l:'',r.L?money(r.L.a):'',r.R?r.R.l:'',r.R?money(r.R.a):'']);body.push(['Total',money(s.tl),'Total',money(s.tr)]);
    const lw=(aw-56)/2;
    doc.autoTable({startY:yy,head:[[s.hl,'Amount (Rs.)',s.hr,'Amount (Rs.)']],body,margin:{left:mx,right:mx},theme:'grid',
      styles:{fontSize:8.5,cellPadding:1.6,lineColor:[150,150,160],lineWidth:.15,textColor:20},headStyles:{fillColor:[231,233,247],textColor:30,fontStyle:'bold'},
      columnStyles:{0:{cellWidth:lw},1:{cellWidth:28,halign:'right'},2:{cellWidth:lw},3:{cellWidth:28,halign:'right'}},
      didParseCell:d=>{if(d.section==='head'){if(d.column.index%2)d.cell.styles.halign='right';return;}
        const i=d.row.index;if(i===body.length-1){d.cell.styles.fontStyle='bold';d.cell.styles.fillColor=[243,244,251];return;}
        const side=d.column.index<2?s.rows[i].L:s.rows[i].R;if(side&&side.b)d.cell.styles.fontStyle='bold';}});
    return doc.lastAutoTable.finalY+7;};
  const tbl=(t,yy)=>{yy=sub(t.title,yy);
    doc.autoTable({startY:yy,head:[t.head],body:t.rows,margin:{left:mx,right:mx},theme:'grid',styles:{fontSize:8,cellPadding:1.5,lineColor:[150,150,160],lineWidth:.15,textColor:20},
      headStyles:{fillColor:[231,233,247],textColor:30,fontStyle:'bold'},
      didParseCell:d=>{if(d.column.index>0)d.cell.styles.halign='right';if(d.section==='body'&&t.boldLast&&d.row.index===t.rows.length-1){d.cell.styles.fontStyle='bold';d.cell.styles.fillColor=[243,244,251];}}});
    return doc.lastAutoTable.finalY+7;};
  const inc=UI.opt.inc;let cy=0,started=false;
  if(inc!=='bs'){
    cy=head((c.hasTrading?'Trading and Profit & Loss Account':'Profit & Loss Account')+' for the year ended '+end);started=true;
    if(S.trading){cy=sub('Trading Account',cy);cy=tee(S.trading,cy);}
    cy=sub('Profit & Loss Account',cy);cy=tee(S.pl,cy);
    if(S.appr){cy=sub('Profit & Loss Appropriation Account',cy);cy=tee(S.appr,cy);}
  }
  if(inc!=='pl'){
    if(started)doc.addPage();
    cy=head('Balance Sheet as at '+end);cy=tee(S.bs,cy);
    S.tables.forEach(t=>{cy=tbl(t,cy);});
  }
  if(UI.opt.sig){
    if(cy>H-42){doc.addPage();cy=20;}
    doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(30);
    doc.text('Place: '+(c.place||''),mx,cy+6);doc.text('Date: ____________',mx,cy+12);
    doc.text('For '+c.name,W-mx,cy+6,{align:'right'});doc.text((c.signatory?c.signatory+' ':'')+'('+roleOf(c)+')',W-mx,cy+24,{align:'right'});
  }
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(7.5);doc.setTextColor(130);
    if(DB.settings.firm)doc.text('Prepared by '+DB.settings.firm,mx,H-7);doc.text('Page '+i+' of '+n,W-mx,H-7,{align:'right'});}
  return doc;
}
function exportPDF(c,y){
  let doc=null;try{doc=buildPDF(c,y);}catch(e){console.error(e);toast('PDF error: '+e.message,1);return;}
  if(!doc){toast('PDF library not loaded – connect to the internet once and reload the page.',1);return;}
  const nm=(c.name+'_FY'+y.fy+'_PL_BS').replace(/[^A-Za-z0-9_\-]+/g,'_')+'.pdf';
  doc.save(nm);y.exports=(y.exports||0)+1;save();toast('PDF exported: '+nm);
}

let IMP={tab:'clients',rows:null,name:'',err:''};
const normK=s=>String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]/g,'');
const pick=(o,keys)=>{for(const k of keys)if(o[k]!==undefined&&String(o[k]).trim()!=='')return String(o[k]).trim();return'';};
function parseCSV(text){
  text=text.replace(/^﻿/,'');const rows=[];let r=[],f='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=ch;}
    else if(ch==='"')q=true;else if(ch===','){r.push(f);f='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;r.push(f);f='';rows.push(r);r=[];}
    else f+=ch;}
  if(f!==''||r.length){r.push(f);rows.push(r);}
  const clean=rows.filter(x=>x.some(v=>String(v).trim()!==''));if(!clean.length)return[];
  const h=clean[0];return clean.slice(1).map(x=>{const o={};h.forEach((k,i)=>o[k]=x[i]!==undefined?x[i]:'');return o;});
}
async function readTable(file){
  if(/\.csv$|\.txt$/i.test(file.name))return parseCSV(await file.text());
  if(!window.XLSX)throw new Error('Excel reader could not load (no internet). Save the sheet as CSV and import that instead.');
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
}
async function impRead(file){
  IMP.name=file.name;IMP.err='';IMP.rows=null;
  try{
    if(IMP.tab==='backup'){const d=JSON.parse(await file.text());if(!d||!Array.isArray(d.clients))throw new Error('This is not a KRN P&L/BS backup file.');IMP.backup=d;IMP.rows=d.clients;}
    else{const raw=(await readTable(file)).map(r=>{const o={};for(const k in r)o[normK(k)]=r[k];return o;});
      IMP.rows=IMP.tab==='clients'?raw.map(parseClientRow):raw.map(parseFigRow);
      if(!IMP.rows.length)throw new Error('No data rows found. Check that the first row contains column headings.');}
  }catch(e){IMP.err=e.message;IMP.rows=null;}
  renderImport();
}
const typeNorm=s=>{s=String(s||'').toLowerCase();return /llp/.test(s)?'LLP':/partner|firm/.test(s)?'Partnership':/comp|pvt|private|ltd|limited/.test(s)?'Company':'Proprietorship';};
const yes=(s,d)=>{s=String(s||'').trim().toLowerCase();if(!s)return d;return /^(y|yes|true|1|trading)/.test(s);};
function findClient(name,pan){const n=(name||'').trim().toLowerCase(),p=(pan||'').trim().toUpperCase();return DB.clients.find(c=>(p&&c.pan&&c.pan.toUpperCase()===p)||(n&&c.name.trim().toLowerCase()===n));}
function parseClientRow(o){
  const r={name:pick(o,['name','clientname','firmname','client','businessname']),pan:pick(o,['pan','panno','pannumber']).toUpperCase(),
    type:typeNorm(pick(o,['entitytype','type','constitution','entity'])),address:pick(o,['address']),signatory:pick(o,['signatory','proprietor','authorisedsignatory','authorizedsignatory','partner','director']),
    place:pick(o,['place','city']),hasTrading:yes(pick(o,['hastradingyesno','hastrading','trading','tradingaccount','maintaintradingaccount']),true),fy:normFY(pick(o,['firstfy','fy','financialyear','year']))||defaultFY(),
    openCapital:num(pick(o,['openingcapital','capital'])),openStock:num(pick(o,['openingstock','stock']))};
  if(!r.name){r.status='bad';r.note='Name missing';return r;}
  if(r.pan&&!/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(r.pan))r.warn='PAN format?';
  const ex=findClient(r.name,r.pan);
  r.status=ex?'dup':'new';r.note=ex?'Already exists ('+ex.name+')':(r.warn||'');return r;
}
function seenDup(rows){const s=new Set();rows.forEach(r=>{if(r.status!=='new')return;const k=r.name.toLowerCase();if(s.has(k)){r.status='dup';r.note='Duplicate in file';}s.add(k);});}

/* figures import: Client, FY, Section, Item, Amount, Rate */
function parseFigRow(o){
  const r={client:pick(o,['client','clientname','name']),pan:pick(o,['pan']).toUpperCase(),fy:normFY(pick(o,['fy','financialyear','year'])),section:normK(pick(o,['section','group','head'])),item:pick(o,['item','particulars','account','ledger']),
    amount:num(pick(o,['amount','value','balance'])),rate:pick(o,['rate','depreciationrate'])};
  const c=findClient(r.client,r.pan);
  if(!c){r.status='bad';r.note='Client not found';return r;}
  if(!r.fy){r.status='bad';r.note='Invalid FY';return r;}
  if(!r.item){r.status='bad';r.note='Item missing';return r;}
  const t=figTarget(c,r);if(t.err){r.status='bad';r.note=t.err;return r;}
  r.status='new';r.note=c.years[r.fy]?'Updates FY '+r.fy:'Creates FY '+r.fy;return r;
}
function figTarget(c,r){
  const sec=r.section,it=normK(r.item);
  const map={trading:{openingstock:'openStock',purchases:'purchases',purchase:'purchases',sales:'sales',sale:'sales',closingstock:'closingStock'},
    capital:{openingcapital:'openCapital',capital:'openCapital',drawings:'drawings',sharecapital:'shareCapital',openingsurplus:'openSurplus',reserves:'openSurplus',reservesandsurplus:'openSurplus',dividend:'dividend'},
    liability:{securedloans:'secured',secured:'secured',unsecuredloans:'unsecured',unsecured:'unsecured',sundrycreditors:'creditors',creditors:'creditors',dutiesandtaxes:'taxes',taxes:'taxes'},
    asset:{sundrydebtors:'debtors',debtors:'debtors',cashinhand:'cash',cash:'cash',loansandadvances:'advances',advances:'advances'}};
  const S={trading:'trading',directexpense:'direct',direct:'direct',indirectexpense:'indirect',indirect:'indirect',expense:'indirect',income:'income',capital:'capital',liability:'liability',asset:'asset',fixedasset:'fixed',fixedassets:'fixed'}[sec];
  if(!S)return{err:'Unknown section "'+sec+'"'};
  if(S==='trading'||S==='capital'){if(!map[S][it])return{err:'Unknown item for '+S};return{S,key:map[S][it]};}
  if(S==='liability'){return{S,key:map.liability[it]||null};}
  if(S==='asset'){return{S,key:map.asset[it]||null,bank:/bank/.test(it)};}
  return{S};
}
function upsert(list,name,v){const f=list.find(x=>(x.n||'').trim().toLowerCase()===name.trim().toLowerCase());if(f)f.v=v;else list.push({n:name,v});}
function applyFig(r){
  const c=findClient(r.client,r.pan),t=figTarget(c,r);let y=c.years[r.fy];if(!y){y=blankYear(r.fy,c);c.years[r.fy]=y;}
  if(t.S==='trading')y.trading[t.key]=r.amount;
  else if(t.S==='capital')y.bs[t.key]=r.amount;
  else if(t.S==='direct')upsert(y.trading.direct,r.item,r.amount);
  else if(t.S==='indirect')upsert(y.pl.indirect,r.item,r.amount);
  else if(t.S==='income')upsert(y.pl.income,r.item,r.amount);
  else if(t.S==='liability'){if(t.key)y.bs[t.key]=r.amount;else upsert(y.bs.otherLiab,r.item,r.amount);}
  else if(t.S==='asset'){if(t.key)y.bs[t.key]=r.amount;else if(t.bank)upsert(y.bs.banks,r.item,r.amount);else upsert(y.bs.otherAssets,r.item,r.amount);}
  else if(t.S==='fixed'){let a=y.bs.assets.find(x=>(x.n||'').trim().toLowerCase()===r.item.trim().toLowerCase());if(!a){a=asset(r.item,10);y.bs.assets.push(a);}a.open=r.amount;if(r.rate!=='')a.rate=dnum(r.rate);}
}

function impApply(){
  if(!IMP.rows)return;let msg='';
  if(IMP.tab==='clients'){
    const upd=$('#impupd')&&$('#impupd').checked;let n=0,u=0;
    IMP.rows.forEach(r=>{
      if(r.status==='new'){const c={id:uid(),name:r.name,pan:r.pan,type:r.type,address:r.address,signatory:r.signatory,place:r.place,hasTrading:r.hasTrading,years:{},created:Date.now()};
        const y=blankYear(r.fy,c);if(r.openStock&&c.hasTrading)y.trading.openStock=r.openStock;if(r.openCapital){if(kindOf(c)==='prop')y.bs.openCapital=r.openCapital;else if(kindOf(c)==='co')y.bs.shareCapital=r.openCapital;}
        c.years[r.fy]=y;DB.clients.push(c);n++;}
      else if(r.status==='dup'&&upd){const c=findClient(r.name,r.pan);if(c){['address','signatory','place'].forEach(k=>{if(r[k])c[k]=r[k];});if(r.pan&&!c.pan)c.pan=r.pan;c.type=r.type;u++;}}});
    msg=n+' client(s) added'+(u?', '+u+' updated':'');
  }else if(IMP.tab==='figures'){
    let n=0;IMP.rows.forEach(r=>{if(r.status==='new'){applyFig(r);n++;}});msg=n+' figure(s) imported';
  }else{
    const mode=($('input[name=impmode]:checked')||{}).value||'merge';
    if(mode==='replace'){if(!confirm('Replace ALL existing data with the backup?'))return;DB={clients:IMP.backup.clients,settings:Object.assign({firm:''},IMP.backup.settings||{})};}
    else{let add=0,rep=0;IMP.backup.clients.forEach(b=>{const i=DB.clients.findIndex(c=>c.id===b.id||c.name.trim().toLowerCase()===b.name.trim().toLowerCase());if(i>=0){DB.clients[i]=b;rep++;}else{DB.clients.push(b);add++;}});msg=add+' added, '+rep+' replaced';}
    if(mode==='replace')msg='All data replaced ('+DB.clients.length+' clients)';
    UI.cid=null;UI.fy=null;
  }
  save();closeModal();UI.view='clients';render();toast(msg);
}
function downloadTemplate(kind){
  if(kind==='clients')download('KRN_Clients_Template.csv','Name,PAN,Entity Type,Address,Signatory,Place,Has Trading (Yes/No),First FY,Opening Capital,Opening Stock\r\nSample Traders,ABCPK1234F,Proprietorship,"1, Sample Street, Chennai",Sample Owner,Chennai,Yes,2025-26,600000,250000\r\nSample Consultants LLP,AABFS9087L,LLP,"2, Demo Road, Chennai",Sample Partner,Chennai,No,2025-26,,\r\n','text/csv');
  else download('KRN_Figures_Template.csv','Client,FY,Section,Item,Amount,Rate\r\nSample Traders,2025-26,Trading,Opening Stock,250000,\r\nSample Traders,2025-26,Trading,Purchases,1800000,\r\nSample Traders,2025-26,Trading,Sales,2450000,\r\nSample Traders,2025-26,Trading,Closing Stock,300000,\r\nSample Traders,2025-26,Direct Expense,Wages,40000,\r\nSample Traders,2025-26,Indirect Expense,Rent,90000,\r\nSample Traders,2025-26,Income,Interest Received,10000,\r\nSample Traders,2025-26,Capital,Opening Capital,600000,\r\nSample Traders,2025-26,Capital,Drawings,120000,\r\nSample Traders,2025-26,Liability,Sundry Creditors,150000,\r\nSample Traders,2025-26,Asset,Sundry Debtors,220000,\r\nSample Traders,2025-26,Asset,Bank - HDFC,130000,\r\nSample Traders,2025-26,Fixed Asset,Furniture & Fixtures,150000,10\r\n','text/csv');
}
function renderImport(){
  const T=IMP.tab,tabs=[['clients','Clients (Excel / CSV)'],['figures','Financial figures (Excel / CSV)'],['backup','Backup / Restore']];
  let body='';
  if(T==='clients')body='<p class="hint">Upload a sheet with columns: <b>Name, PAN, Entity Type, Address, Signatory, Place, Has Trading (Yes/No), First FY, Opening Capital, Opening Stock</b>. Only Name is mandatory. Existing clients (same PAN or name) are skipped.</p><button class="btn s sm" data-act="impTemplate" data-a="clients">⬇ Download template</button>';
  else if(T==='figures')body='<p class="hint">Bulk-load year figures. Columns: <b>Client, FY, Section, Item, Amount, Rate</b>. Sections: Trading, Direct Expense, Indirect Expense, Income, Capital, Liability, Asset, Fixed Asset (Amount = opening WDV, Rate = depreciation %). The client must already exist; a missing FY is created.</p><button class="btn s sm" data-act="impTemplate" data-a="figures">⬇ Download template</button>';
  else body='<p class="hint">Restore a backup file created with the Backup button, or download a fresh backup now.</p><button class="btn s sm" data-act="backup">⬇ Download backup now</button>';
  body+='<div class="drop">'+(IMP.name?'<b>'+esc(IMP.name)+'</b><br>':'')+'<input type="file" data-chg="impFile" accept="'+(T==='backup'?'.json,application/json':'.csv,.xlsx,.xls')+'"></div>';
  if(IMP.err)body+='<div class="bar err">'+esc(IMP.err)+'</div>';
  let canApply=false;
  if(IMP.rows){
    if(T==='clients'){seenDup(IMP.rows);const nw=IMP.rows.filter(r=>r.status==='new').length;canApply=nw>0||IMP.rows.some(r=>r.status==='dup');
      body+='<div class="hint"><b>'+nw+'</b> new &middot; '+IMP.rows.filter(r=>r.status==='dup').length+' existing &middot; '+IMP.rows.filter(r=>r.status==='bad').length+' invalid</div><div class="scroll"><table><tr><th>Name</th><th>PAN</th><th>Type</th><th>Trading</th><th>FY</th><th>Status</th></tr>'+IMP.rows.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+esc(r.pan)+'</td><td>'+esc(r.type||'')+'</td><td>'+(r.name?(r.hasTrading?'Yes':'No'):'')+'</td><td>'+esc(r.fy||'')+'</td><td><span class="tag '+({new:'t2',dup:'t3',bad:'t5'}[r.status])+'">'+({new:'New',dup:'Skip',bad:'Invalid'}[r.status])+'</span> <small>'+esc(r.note||'')+'</small></td></tr>').join('')+'</table></div><label class="sw" style="margin-top:10px"><input type="checkbox" class="chk" id="impupd"><span class="tg"></span>Update address / signatory / place of existing clients</label>';}
    else if(T==='figures'){const ok=IMP.rows.filter(r=>r.status==='new').length;canApply=ok>0;
      body+='<div class="hint"><b>'+ok+'</b> valid &middot; '+(IMP.rows.length-ok)+' invalid (skipped)</div><div class="scroll"><table><tr><th>Client</th><th>FY</th><th>Section</th><th>Item</th><th class="r">Amount</th><th>Status</th></tr>'+IMP.rows.map(r=>'<tr><td>'+esc(r.client)+'</td><td>'+esc(r.fy)+'</td><td>'+esc(r.section)+'</td><td>'+esc(r.item)+'</td><td class="r">'+inr(r.amount)+'</td><td><span class="tag '+(r.status==='new'?'t2':'t5')+'">'+(r.status==='new'?'OK':'Skip')+'</span> <small>'+esc(r.note||'')+'</small></td></tr>').join('')+'</table></div>';}
    else{canApply=true;const ny=IMP.rows.reduce((s,c)=>s+Object.keys(c.years||{}).length,0);
      body+='<div class="hint">Backup contains <b>'+IMP.rows.length+'</b> client(s) and <b>'+ny+'</b> financial year(s).</div><label class="sw" style="margin:8px 0"><input type="radio" name="impmode" value="merge" checked> &nbsp;Merge – add new clients, replace clients with the same name</label><label class="sw"><input type="radio" name="impmode" value="replace"> &nbsp;Replace everything currently in this browser</label>';}
  }
  showModal('<div class="mbox"><h2>Import / Backup</h2><div class="mtabs">'+tabs.map(t=>'<div class="st '+(t[0]===T?'a':'')+'" data-act="impTab" data-a="'+t[0]+'">'+t[1]+'</div>').join('')+'</div>'+body+'<div class="mfoot"><button class="btn s" data-act="closeModal">Close</button>'+(canApply?'<button class="btn" data-act="impApply">Import</button>':'')+'</div></div>');
}

/* ================= init ================= */
render();
</script></body></html>
