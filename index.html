<body>
<div class="app"><aside class="side" id="side"></aside><main class="main" id="main"></main></div>
<div id="lock"></div><div id="modal"></div><div id="toast"></div>
<script>
'use strict';
/* ================= helpers ================= */
const KEY='krn_plbs_v1';const FIRM='KRN Tax Consultancy';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{if(typeof v==='number')return isFinite(v)?Math.round(v):0;const n=parseFloat(String(v==null?'':v).replace(/[,₹\s]/g,''));return isFinite(n)?Math.round(n):0;};
const dnum=v=>{const n=parseFloat(v);return isFinite(n)?n:0;};
const inr=n=>(Math.round(n)||0).toLocaleString('en-IN');
const money=n=>n<0?'('+inr(-n)+')':inr(n);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sum=a=>(a||[]).reduce((s,r)=>s+num(r.v),0);
const getPath=(o,p)=>p.split('.').reduce((x,k)=>x==null?x:x[k],o);
const setPath=(o,p,v)=>{const k=p.split('.');let x=o;for(let i=0;i<k.length-1;i++)x=x[k[i]];x[k[k.length-1]]=v;};
const ENTITY=['Proprietorship','Partnership','LLP','Company'];
const kindOf=c=>c.type==='Company'?'co':(c.type==='Partnership'||c.type==='LLP')?'firm':'prop';

/* ---- financial year helpers ---- */
const curFYStart=()=>{const d=new Date();return d.getMonth()>=3?d.getFullYear():d.getFullYear()-1;};
const fyFrom=y=>y+'-'+String((y+1)%100).padStart(2,'0');
const fyStart=fy=>parseInt(fy.slice(0,4),10);
const nextFY=fy=>fyFrom(fyStart(fy)+1), prevFY=fy=>fyFrom(fyStart(fy)-1);
const fyEndText=fy=>'31st March '+(fyStart(fy)+1);
const fyList=()=>{const a=[];for(let y=2012;y<=curFYStart()+1;y++)a.push(fyFrom(y));return a.reverse();};
const defaultFY=()=>fyFrom(curFYStart()-1);
function normFY(s){s=String(s||'');let m=/(\d{4})\s*[-–\/]\s*(\d{2,4})/.exec(s)||/(\d{4})/.exec(s);if(!m)return'';const y=+m[1];return(y>=2000&&y<=2100)?fyFrom(y):'';}

/* ================= storage ================= */
let memOnly=false;
function loadDB(){try{const s=localStorage.getItem(KEY);if(s){const d=JSON.parse(s);if(d&&Array.isArray(d.clients)){d.settings=d.settings||{firm:FIRM};if(!d.settings.firm)d.settings.firm=FIRM;return d;}}}catch(e){memOnly=true;}return{clients:[],settings:{firm:FIRM}};}
let DB=loadDB(),saveT=null,SKIPSYNC=false;
function saveNow(){try{localStorage.setItem(KEY,JSON.stringify(DB));memOnly=false;setInd('Saved locally ✓ '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));}catch(e){memOnly=true;setInd('⚠ Not saved (storage blocked) – take a backup');}
  if(typeof syncDirty==='function')syncDirty();}
function save(){setInd('Saving…');clearTimeout(saveT);saveT=setTimeout(saveNow,250);}
function setInd(t){const e=$('#saveind');if(e)e.textContent=t;}

/* ================= state ================= */
const UI={view:'clients',cid:null,fy:null,ret:null,q:'',ft:'',opt:{inc:'all',orient:'p',sig:true}};
let FORM=null;
const curClient=()=>DB.clients.find(c=>c.id===UI.cid)||null;
const curYear=()=>{const c=curClient();return c&&UI.fy?c.years[UI.fy]||null:null;};
const latestFY=c=>Object.keys(c.years).sort().pop()||null;

/* ================= data model ================= */
const asset=(n,rate)=>({n,rate,open:0,addFull:0,addHalf:0,disposal:0});
function blankYear(fy,c){
  return{fy,done:false,exports:0,created:Date.now(),
    trading:{openStock:0,purchases:0,sales:0,closingStock:0,direct:[{n:'Freight & Carriage',v:0},{n:'Wages',v:0}]},
    pl:{indirect:[{n:'Salaries',v:0},{n:'Rent',v:0},{n:'Office Expenses',v:0},{n:'Interest on Loan',v:0}],
        income:c.hasTrading?[{n:'Interest Received',v:0}]:[{n:'Professional Fees / Service Receipts',v:0},{n:'Interest Received',v:0}]},
    bs:{openCapital:0,capIntro:0,advRecd:0,debtorList:[],creditorList:[],loanList:[],drawings:0,shareCapital:0,openSurplus:0,dividend:0,interestRate:0,
        partners:kindOf(c)==='firm'?[{name:'',ratio:50,openCapital:0,drawings:0,remuneration:0,intro:0},{name:'',ratio:50,openCapital:0,drawings:0,remuneration:0,intro:0}]:[],
        secured:0,unsecured:0,creditors:0,taxes:0,otherLiab:[],
        debtors:0,cash:0,banks:[{n:'Bank Account',v:0}],advances:0,otherAssets:[],
        assets:[asset('Furniture & Fixtures',10),asset('Computers',40),asset('Plant & Machinery',15)],
        autoBalance:false}};
}

/* ================= calculations ================= */
function compute(c,y){
  const kind=kindOf(c),t=y.trading,b=y.bs,hasT=!!c.hasTrading;
  const direct=hasT?sum(t.direct):0;
  const gp=hasT?(num(t.sales)+num(t.closingStock))-(num(t.openStock)+num(t.purchases)+direct):0;
  const fa=(b.assets||[]).map(a=>{
    const r=dnum(a.rate)/100,full=Math.max(num(a.open)+num(a.addFull)-num(a.disposal),0);
    const dep=Math.round(full*r+num(a.addHalf)*r/2);
    const total=num(a.open)+num(a.addFull)+num(a.addHalf)-num(a.disposal);
    return{dep,close:total-dep,total};});
  const dep=fa.reduce((s,x)=>s+x.dep,0),faClose=fa.reduce((s,x)=>s+x.close,0);
  const indirect=sum(y.pl.indirect),income=sum(y.pl.income);
  const np=gp+income-indirect-dep;
  const eff=(k,lk)=>{const L=b[lk]||[];return L.some(r=>num(r.v))?sum(L):num(b[k]);};
  const debtors=eff('debtors','debtorList'),creditors=eff('creditors','creditorList'),unsec=eff('unsecured','loanList');
  const o={kind,gp,direct,fa,dep,faClose,indirect,income,np,partners:[],noRatio:false,debtors,creditors,unsecured:unsec};
  if(kind==='prop'){o.capClose=num(b.openCapital)+num(b.capIntro)+np-num(b.drawings);o.capTotal=o.capClose;}
  else if(kind==='firm'){
    const P=b.partners||[],rate=dnum(b.interestRate);
    const ints=P.map(p=>Math.round(num(p.openCapital)*rate/100)),rems=P.map(p=>num(p.remuneration));
    const ti=ints.reduce((s,x)=>s+x,0),tr=rems.reduce((s,x)=>s+x,0),pool=np-ti-tr;
    const rs=P.reduce((s,p)=>s+Math.max(dnum(p.ratio),0),0);o.ratioSum=rs;
    let shares=P.map(()=>0);
    if(rs>0&&P.length){shares=P.map(p=>Math.round(pool*Math.max(dnum(p.ratio),0)/rs));shares[P.length-1]+=pool-shares.reduce((s,x)=>s+x,0);}else if(P.length)o.noRatio=true;
    o.partners=P.map((p,i)=>({name:p.name||('Partner '+(i+1)),open:num(p.openCapital),int:ints[i],rem:rems[i],share:shares[i],draw:num(p.drawings),intro:num(p.intro),
      close:num(p.openCapital)+num(p.intro)+ints[i]+rems[i]+shares[i]-num(p.drawings)}));
    o.ti=ti;o.tr=tr;o.pool=pool;o.capTotal=o.partners.reduce((s,p)=>s+p.close,0);
  }else{o.surplusClose=num(b.openSurplus)+np-num(b.dividend);o.capTotal=num(b.shareCapital)+o.surplusClose;}
  const liabOther=num(b.secured)+unsec+creditors+num(b.taxes)+num(b.advRecd)+sum(b.otherLiab);
  const stock=hasT?num(t.closingStock):0;
  o.stock=stock;o.bankTotal=sum(b.banks);o.tradeDr=hasT?num(t.openStock)+num(t.purchases)+direct:0;o.tradeCr=hasT?num(t.sales)+num(t.closingStock):0;o.curAssets=stock+debtors+num(b.cash)+o.bankTotal+num(b.advances)+sum(b.otherAssets);

const baseLbl=l=>String(l).replace(/\s*\((?:as per )?Schedule \d+\)/,'');
function mergePrev(cur,prev,cfy,pfy){

    cy=sig(cy);
    S.tables.forEach(t=>{doc.addPage();cy=head(t.title+' '+t.when+' '+end);cy=tbl(t,cy);});
  }else cy=sig(cy);
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(7.5);doc.setTextColor(130);
    if(DB.settings.firm)doc.text('Prepared by '+DB.settings.firm,mx,H-7);doc.text('Page '+i+' of '+n,W-mx,H-7,{align:'right'});}
  return doc;
}

/* ---- last-FY reference column (entry screens only; never affects PDF) ---- */
function decoratePrev(){
  const c=curClient(),y=curYear();if(!c||!y)return;
  const py=c.years[prevFY(y.fy)];if(!py)return;
  const main=$('#main'),m0=compute(c,py),kind=kindOf(c),pb=py.bs;
  main.classList.add('pvon');
  const fm=v=>v?money(v):'–',ch=(t,cls)=>{const d=document.createElement('div');d.className='pv'+(cls?' '+cls:'');d.textContent=t;return d;};
  const nm=s=>String(s||'').trim().toLowerCase();
  const OUT={gp:m0.gp,np:m0.np,indirect:m0.indirect,income:m0.income,dep:m0.dep,direct:m0.direct,faClose:m0.faClose,totalLiab:m0.totalLiab,totalAssets:m0.totalAssets,capTotal:m0.capTotal,result:m0.gp+m0.income-m0.indirect,bankTotal:m0.bankTotal,expdep:m0.indirect+m0.dep,tradeDr:m0.tradeDr,tradeCr:m0.tradeCr,curAssets:m0.curAssets,npl:m0.np,gpl:m0.gp,debtorsT:m0.debtors,creditorsT:m0.creditors,loansT:m0.unsecured};
  const EFF={'bs.openCapital':kind==='prop'?m0.capClose:undefined,'bs.openSurplus':m0.surplusClose,'bs.debtors':m0.debtors,'bs.creditors':m0.creditors,'bs.unsecured':m0.unsecured};
  const lists=['trading.direct','pl.income','pl.indirect','bs.otherLiab','bs.banks','bs.otherAssets','bs.debtorList','bs.creditorList','bs.loanList'];
  const prevOf=(path)=>{
    if(path in EFF)return EFF[path];
    const mm=path.match(/^(.*)\.(\d+)\.v$/);
    if(mm&&lists.includes(mm[1])){const cur=getPath(y,mm[1])[+mm[2]],pl=getPath(py,mm[1])||[];if(!cur||!nm(cur.n))return undefined;const f=pl.find(r=>nm(r.n)===nm(cur.n));return f?num(f.v):0;}
    if(/^bs\.assets\.\d+\.open$/.test(path)){const i=+path.split('.')[2],cur=y.bs.assets[i],f=(py.bs.assets||[]).findIndex(a=>nm(a.n)===nm(cur&&cur.n));return f>=0&&m0.fa[f]?m0.fa[f].close:undefined;}
    if(/^bs\.partners\.\d+\.openCapital$/.test(path)){const i=+path.split('.')[2],cur=y.bs.partners[i],f=m0.partners.findIndex(p=>nm(p.name)===nm(cur&&cur.name));return f>=0?m0.partners[f].close:undefined;}
    if(/\.n$|\.name$|\.rate$|\.ratio$|\.addFull$|\.addHalf$|\.disposal$|\.remuneration$|\.intro$|\.drawings$/.test(path)&&/^bs\.(assets|partners)/.test(path)){
      const mm2=path.match(/^bs\.(assets|partners)\.\d+\.(\w+)$/);return undefined;}
    const v=getPath(py,path);return typeof v==='number'?num(v):undefined;
  };
  /* simple rows and list rows */
  main.querySelectorAll('.row>input[data-bind][data-t="n"],.row2>input[data-bind][data-t="n"]').forEach(el=>{
    const v=prevOf(el.dataset.bind);el.insertAdjacentElement('afterend',ch(v===undefined?'':fm(v),v===undefined?'e':''));});
  main.querySelectorAll('.row>[data-out]').forEach(el=>{const k=el.dataset.out;el.insertAdjacentElement('afterend',ch(k in OUT?money(OUT[k]):'',k in OUT?'':'e'));});
  /* totals */
  main.querySelectorAll('.tot').forEach(t=>{const o=t.querySelector(':scope>[data-out]');const k=o&&o.dataset.out;if(k&&k in OUT){const s=document.createElement('span');s.className='pvt';s.textContent=money(OUT[k]);t.appendChild(s);}});
  /* tables: last-year closing under opening fields */
  main.querySelectorAll('.tbl-in input[data-bind$=".open"],.tbl-in input[data-bind$=".openCapital"]').forEach(el=>{
    const v=prevOf(el.dataset.bind);if(v!==undefined){const d=document.createElement('div');d.className='pv2';d.textContent='Last FY close: '+fm(v);el.insertAdjacentElement('afterend',d);}});
  /* last-year-only heads as ghost rows */
  lists.forEach(path=>{
    const add=main.querySelector('.add[data-a="'+path+'"]');if(!add)return;
    const cur=(getPath(y,path)||[]).map(r=>nm(r.n));
    (getPath(py,path)||[]).forEach(r=>{if(!nm(r.n)||!num(r.v)||cur.includes(nm(r.n)))return;
      const g=document.createElement('div');g.className='row2 ghost';
      g.innerHTML='<div class="gname">'+esc(r.n)+' <small>last FY only</small></div><div class="gz">–</div><div class="pv">'+fm(num(r.v))+'</div><button class="x gx" title="Add this head to this year" data-act="addGhost" data-a="'+esc(path+'|'+r.n)+'">+</button>';
      add.parentNode.insertBefore(g,add);});});
  /* legend */
  const grid=main.querySelector('.grid');
  if(grid){const l=document.createElement('div');l.className='pvlegend';l.innerHTML='<span class="pv" style="display:inline-block;padding:2px 10px">Amber</span> = FY '+esc(py.fy)+' (last year) – for reference only, not part of this year’s figures';grid.parentNode.insertBefore(l,grid);}
}

const blankForm=()=>({id:null,name:'',trade:'',pan:'',type:'Proprietorship',address:'',signatory:'',place:'',hasTrading:true,fy:defaultFY()});

const A={
  go(v){if(v==='overview'&&!curClient())return;UI.view=v;render();window.scrollTo(0,0);},
  step(v){if(v==='form'){A.editClient(UI.cid,null,null,true);return;}go(v);},
  newClient(){FORM=blankForm();UI.ret=null;go('form');},
  editClient(id,_a,_b,fromYear){const c=DB.clients.find(x=>x.id===id);if(!c)return;FORM=JSON.parse(JSON.stringify(c));delete FORM.years;UI.cid=id;UI.ret=fromYear?'pl':null;go('form');},
  cancelForm(){FORM=null;go(UI.ret||(UI.cid&&curClient()?'overview':'clients'));UI.ret=null;},
  saveClient(){
    const f=FORM;f.name=(f.name||'').trim();f.trade=(f.trade||'').trim();
    if(!f.name){toast('Client name is required',1);return;}
    if(DB.clients.some(c=>c.id!==f.id&&c.name.trim().toLowerCase()===f.name.toLowerCase())){toast('A client with this name already exists',1);return;}
    f.pan=(f.pan||'').trim().toUpperCase();
    if(f.pan&&!/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(f.pan)&&!confirm('PAN "'+f.pan+'" does not look like a valid PAN (e.g. ABCPK1234F). Save anyway?'))return;
    if(f.id){const c=DB.clients.find(x=>x.id===f.id);const wasT=c.hasTrading,wasK=kindOf(c);Object.assign(c,{name:f.name,trade:f.trade,pan:f.pan,type:f.type,address:f.address,signatory:f.signatory,place:f.place,hasTrading:f.hasTrading});
      if(kindOf(c)==='firm'&&wasK!=='firm')Object.values(c.years).forEach(y=>{if(!y.bs.partners.length)y.bs.partners=blankYear(y.fy,c).bs.partners;});
      save();toast('Client updated');const r=UI.ret;FORM=null;UI.ret=null;go(r||'overview');}
    else{const c={id:uid(),name:f.name,trade:f.trade,pan:f.pan,type:f.type,address:f.address,signatory:f.signatory,place:f.place,hasTrading:f.hasTrading,years:{},created:Date.now()};
      c.years[f.fy]=blankYear(f.fy,c);DB.clients.push(c);save();UI.cid=c.id;UI.fy=f.fy;FORM=null;toast('Client created');go('pl');}
  },
  delClient(id){const c=DB.clients.find(x=>x.id===id);if(!c)return;if(!confirm('Delete "'+c.name+'" and ALL its financial years? This cannot be undone.'))return;DB.clients=DB.clients.filter(x=>x.id!==id);if(UI.cid===id){UI.cid=null;UI.fy=null;}save();render();toast('Client deleted');},
  openClient(id){UI.cid=id;UI.fy=null;go('overview');},
  openYear(fy){UI.fy=fy;go('pl');},
  pdfYear(fy){const c=curClient();UI.fy=fy;exportPDF(c,c.years[fy]);},
  delYear(fy){const c=curClient();if(!confirm('Delete FY '+fy+' for '+c.name+'?'))return;delete c.years[fy];if(UI.fy===fy)UI.fy=null;save();render();},
  createYear(fy){const c=curClient();if(c.years[fy]){UI.fy=fy;go('pl');return;}newYear(c,fy);UI.fy=fy;toast('FY '+fy+' created with closing balances carried forward');go('pl');},
  addYear(){

  },
  doAddYear(){const fy=$('#newfy').value;closeModal();A.createYear(fy);},
  closeModal(){closeModal();},
  addRow(path){const y=curYear(),arr=getPath(y,path),k=path.split('.').pop();

    render();const el=$('[data-bind="'+path+'.'+(arr.length-1)+'.'+(k==='partners'?'name':'n')+'"]');if(el)el.focus();},

  delRow(path){const y=curYear(),p=path.split('.'),i=+p.pop(),arr=getPath(y,p.join('.'));arr.splice(i,1);save();render();},

  pdf(){exportPDF(curClient(),curYear());},
  backup(){download('KRN_PLBS_Backup_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({app:'krn-plbs',version:1,exported:new Date().toISOString(),settings:DB.settings,clients:DB.clients},null,1),'application/json');toast('Backup downloaded');},
  wipe(){if(syncOn()&&!confirm('GitHub sync is ON: the cloud copy will be overwritten by whatever you enter next. Download a Backup first. Continue?'))return;if(!confirm('Delete ALL clients and data from this browser? Take a backup first.'))return;if(!confirm('Really delete everything?'))return;DB={clients:[],settings:DB.settings};UI.cid=null;UI.fy=null;save();go('clients');},
  openImport(tab){IMP={tab:tab||'clients',rows:null,name:'',err:''};renderImport();},

};

const grpNorm=s=>{s=normK(s);return /^income/.test(s)?'inc':/^purch/.test(s)?'pur':/^direct/.test(s)?'dir':/^(indirect|expense)/.test(s)?'ind':'';};
const MONS={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function parseDate(v){
  const ok=(y,m,d)=>(y>=2000&&y<=2100&&m>=1&&m<=12&&d>=1&&d<=31)?{y,m,d}:null;
  if(v instanceof Date&&!isNaN(v))return ok(v.getFullYear(),v.getMonth()+1,v.getDate());
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return ok(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate());}
  const s=String(v==null?'':v).trim();if(!s)return null;
  if(/^\d{5}(\.\d+)?$/.test(s))return parseDate(parseFloat(s));
  let m=/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/.exec(s);if(m)return ok(+m[1],+m[2],+m[3]);
  m=/^(\d{1,2})[-\/.\s](\d{1,2})[-\/.\s](\d{2,4})/.exec(s);if(m){let y=+m[3];if(y<100)y+=2000;return ok(y,+m[2],+m[1]);}
  m=/^(\d{1,2})[-\/.\s]([A-Za-z]{3})[A-Za-z]*[-\/.\s,]*(\d{2,4})/.exec(s);if(m&&MONS[m[2].toLowerCase()]){let y=+m[3];if(y<100)y+=2000;return ok(y,MONS[m[2].toLowerCase()],+m[1]);}
  return null;
}
const fyOfDate=d=>fyFrom(d.m>=4?d.y:d.y-1);
const amtF=v=>{if(typeof v==='number')return isFinite(v)?v:0;let s=String(v==null?'':v).replace(/[,₹\s]/g,'');let neg=/^\(.*\)$/.test(s);s=s.replace(/[()]/g,'');const n=parseFloat(s);return isFinite(n)?(neg?-n:n):0;};
async function readLedger(file){

  else{
    if(!window.XLSX)throw new Error('Excel reader could not load (no internet). Save the Ledger sheet as CSV and import that instead.');
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    const nm=wb.SheetNames,lo=n=>n.toLowerCase();
    const ls=nm.find(n=>lo(n)==='ledger')||nm.find(n=>!/categor|example|how to|instruction/i.test(n))||nm[0];
    raw=XLSX.utils.sheet_to_json(wb.Sheets[ls],{defval:'',raw:true});
    const cn=nm.find(n=>/categor/i.test(n));
    if(cn)XLSX.utils.sheet_to_json(wb.Sheets[cn],{defval:''}).forEach(r=>{const o={};for(const k in r)o[normK(k)]=r[k];const n=pick(o,['category','name','head']);if(n)cats[n.toLowerCase()]={name:n,g:grpNorm(pick(o,['group','section','type']))};});
  }
  const rows=[];
  raw.forEach((r0,i)=>{const o={};for(const k in r0)o[normK(k)]=r0[k];
    const dv=o.date!==undefined?o.date:(o.txndate!==undefined?o.txndate:(o.transactiondate!==undefined?o.transactiondate:(o.voucherdate!==undefined?o.voucherdate:'')));
    const r={row:i+2,dateRaw:dv,date:parseDate(dv),part:pick(o,['particulars','narration','description','details','remarks']),
      dr:amtF(pick(o,['debit','dr','withdrawal','withdrawals','paid'])||0),cr:amtF(pick(o,['credit','cr','deposit','deposits','received'])||0),
      type:pick(o,['type','nature','incomeexpense']),cat:pick(o,['category','head','ledger','account','expensehead'])};
    if(!r.part&&!r.dr&&!r.cr&&!r.type&&!r.cat&&(dv===''||dv==null))return;rows.push(r);});
  if(!rows.length)throw new Error('No ledger rows found. The first row must have the headings: Date, Particulars, Debit, Credit, Type, Category.');
  return{rows,cats};
}
function ledClassify(L,c,fy){
  const known={};LEDCATS.forEach(([n,g])=>known[n.toLowerCase()]={name:n,g});
  Object.keys(L.cats).forEach(k=>{const e=L.cats[k];known[k]={name:e.name,g:e.g||(known[k]&&known[k].g)||''};});
  const hasT=!!c.hasTrading,agg={},res={rows:[],agg:[],cnt:{ok:0,ign:0,out:0,bad:0},tot:{}};
  L.rows.forEach(r0=>{
    const r=Object.assign({},r0);res.rows.push(r);
    const dr=r.dr,cr=r.cr;
    let t=/^(inc|rec|cr)/i.test(r.type)?'inc':/^(exp|pay|dr)/i.test(r.type)?'exp':/^(ign|bs|skip|no|bal)/i.test(r.type)?'ign':'';
    const k=r.cat?known[r.cat.toLowerCase()]:null,g=k?k.g:'';
    if(!t&&g)t=g==='inc'?'inc':'exp';
    if(t==='ign'){r.st='ign';r.note='Ignored (Balance Sheet item)';res.cnt.ign++;return;}
    if(!r.date){r.st='bad';r.note='Date missing or not readable';res.cnt.bad++;return;}
    if(fyOfDate(r.date)!==fy){r.st='out';r.note='Outside FY '+fy+' ('+fyOfDate(r.date)+')';res.cnt.out++;return;}
    if(!t){r.st='bad';r.note='Type missing (Income / Expense / Ignore)';res.cnt.bad++;return;}
    if(!dr&&!cr){r.st='bad';r.note='No amount';res.cnt.bad++;return;}
    let name=k?k.name:(r.cat||''),warn='';
    if(!name){name=t==='inc'?'Other Income':'Miscellaneous Expenses';warn='No category – put under '+name;}
    let sec,amt;
    if(t==='inc'){amt=cr-dr;sec=(name.toLowerCase()==='sales'&&hasT)?'sales':'inc';if(g&&g!=='inc')warn='Category is an expense head but Type is Income';}
    else{amt=dr-cr;sec=g==='pur'&&hasT?'pur':g==='dir'&&hasT?'dir':'ind';if(g==='inc')warn='Category is an income head but Type is Expense';}
    if(amt<0&&!warn)warn='Entered on the opposite side – treated as a reversal';
    r.st='ok';r.note=warn;r.sec=sec;r.name=name;r.amt=amt;res.cnt.ok++;
    const key=sec+'|'+(sec==='sales'||sec==='pur'?sec:name.toLowerCase());
    (agg[key]=agg[key]||{sec,name:sec==='sales'?'Sales':sec==='pur'?'Purchases':name,n:0,amt:0});agg[key].n++;agg[key].amt+=amt;
  });
  const ord={sales:0,pur:1,dir:2,ind:3,inc:4};
  res.agg=Object.values(agg).sort((a,b)=>ord[a.sec]-ord[b.sec]||a.name.localeCompare(b.name));
  const S=s=>Math.round(res.agg.filter(x=>x.sec===s).reduce((q,x)=>q+x.amt,0));
  res.tot={sales:S('sales'),pur:S('pur'),dir:S('dir'),ind:S('ind'),inc:S('inc')};
  res.tot.income=res.tot.sales+res.tot.inc;res.tot.exp=res.tot.pur+res.tot.dir+res.tot.ind;res.tot.net=res.tot.income-res.tot.exp;
  return res;
}

function ledApply(){
  const led=IMP.led;if(!led)return;
  const c=DB.clients.find(x=>x.id===led.cid);if(!c)return;
  const R=ledClassify(led,c,led.fy);if(!R.cnt.ok)return;
  let y=c.years[led.fy];if(!y)y=newYear(c,led.fy);
  const clr=list=>{for(let i=list.length-1;i>=0;i--){if(list[i].src==='L'){if(LEDDEF.has(list[i].n)){list[i].v=0;delete list[i].src;}else list.splice(i,1);}}};
  clr(y.trading.direct);clr(y.pl.indirect);clr(y.pl.income);
  if(y.imp&&y.imp.sales)y.trading.sales=0;if(y.imp&&y.imp.pur)y.trading.purchases=0;
  const put=(list,x)=>{const v=Math.round(x.amt);const f=list.find(z=>(z.n||'').trim().toLowerCase()===x.name.toLowerCase());if(f){f.v=v;f.src='L';}else list.push({n:x.name,v,src:'L'});};
  let hasS=false,hasP=false;
  R.agg.forEach(x=>{
    if(x.sec==='sales'){y.trading.sales=Math.round(x.amt);hasS=true;}
    else if(x.sec==='pur'){y.trading.purchases=Math.round(x.amt);hasP=true;}
    else if(x.sec==='dir')put(y.trading.direct,x);
    else if(x.sec==='ind')put(y.pl.indirect,x);
    else put(y.pl.income,x);});
  y.imp={file:IMP.name||'ledger',at:Date.now(),rows:R.cnt.ok,sales:hasS,pur:hasP};
  UI.cid=c.id;UI.fy=led.fy;save();closeModal();UI.view='pl';render();window.scrollTo(0,0);
  toast(R.cnt.ok+' ledger rows imported into FY '+led.fy+'. Net before depreciation: Rs. '+inr(R.tot.net));
}

let IMP={tab:'clients',rows:null,name:'',err:''};
const normK=s=>String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]/g,'');
const pick=(o,keys)=>{for(const k of keys)if(o[k]!==undefined&&String(o[k]).trim()!=='')return String(o[k]).trim();return'';};
function parseCSV(text){
  text=text.replace(/^﻿/,'');const rows=[];let r=[],f='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=ch;}
    else if(ch==='"')q=true;else if(ch===','){r.push(f);f='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;r.push(f);f='';rows.push(r);r=[];}
    else f+=ch;}
  if(f!==''||r.length){r.push(f);rows.push(r);}
  const clean=rows.filter(x=>x.some(v=>String(v).trim()!==''));if(!clean.length)return[];
  const h=clean[0];return clean.slice(1).map(x=>{const o={};h.forEach((k,i)=>o[k]=x[i]!==undefined?x[i]:'');return o;});
}
async function readTable(file){
  if(/\.csv$|\.txt$/i.test(file.name))return parseCSV(await file.text());
  if(!window.XLSX)throw new Error('Excel reader could not load (no internet). Save the sheet as CSV and import that instead.');
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
}
async function impRead(file){
  IMP.name=file.name;IMP.err='';IMP.rows=null;IMP.led=null;
  try{
    if(IMP.tab==='backup'){const d=JSON.parse(await file.text());if(!d||!Array.isArray(d.clients))throw new Error('This is not a KRN P&L/BS backup file.');IMP.backup=d;IMP.rows=d.clients;}
    else if(IMP.tab==='ledger'){const L=await readLedger(file);IMP.rows=L.rows;ledInit(L);}
    else{const raw=(await readTable(file)).map(r=>{const o={};for(const k in r)o[normK(k)]=r[k];return o;});
      IMP.rows=IMP.tab==='clients'?raw.map(parseClientRow):raw.map(parseFigRow);
      if(!IMP.rows.length)throw new Error('No data rows found. Check that the first row contains column headings.');}
  }catch(e){IMP.err=e.message;IMP.rows=null;}
  renderImport();
}
const typeNorm=s=>{s=String(s||'').toLowerCase();return /llp/.test(s)?'LLP':/partner|firm/.test(s)?'Partnership':/comp|pvt|private|ltd|limited/.test(s)?'Company':'Proprietorship';};
const yes=(s,d)=>{s=String(s||'').trim().toLowerCase();if(!s)return d;return /^(y|yes|true|1|trading)/.test(s);};
function findClient(name,pan){const n=(name||'').trim().toLowerCase(),p=(pan||'').trim().toUpperCase();return DB.clients.find(c=>(p&&c.pan&&c.pan.toUpperCase()===p)||(n&&(c.name.trim().toLowerCase()===n||(c.trade||'').trim().toLowerCase()===n)));}
function parseClientRow(o){
  const r={name:pick(o,['legalname','name','clientname','firmname','client']),trade:pick(o,['tradename','businessname','tradingas']),pan:pick(o,['pan','panno','pannumber']).toUpperCase(),
    type:typeNorm(pick(o,['entitytype','type','constitution','entity'])),address:pick(o,['address']),signatory:pick(o,['signatory','proprietor','authorisedsignatory','authorizedsignatory','partner','director']),
    place:pick(o,['place','city']),hasTrading:yes(pick(o,['hastradingyesno','hastrading','trading','tradingaccount','maintaintradingaccount']),true),fy:normFY(pick(o,['firstfy','fy','financialyear','year']))||defaultFY(),
    openCapital:num(pick(o,['openingcapital','capital'])),openStock:num(pick(o,['openingstock','stock']))};
  if(!r.name){r.status='bad';r.note='Name missing';return r;}
  if(r.pan&&!/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(r.pan))r.warn='PAN format?';
  const ex=findClient(r.name,r.pan);
  r.status=ex?'dup':'new';r.note=ex?'Already exists ('+ex.name+')':(r.warn||'');return r;
}
function seenDup(rows){const s=new Set();rows.forEach(r=>{if(r.status!=='new')return;const k=r.name.toLowerCase();if(s.has(k)){r.status='dup';r.note='Duplicate in file';}s.add(k);});}

/* figures import: Client, FY, Section, Item, Amount, Rate */
function parseFigRow(o){
  const r={client:pick(o,['client','clientname','name']),pan:pick(o,['pan']).toUpperCase(),fy:normFY(pick(o,['fy','financialyear','year'])),section:normK(pick(o,['section','group','head'])),item:pick(o,['item','particulars','account','ledger']),
    amount:num(pick(o,['amount','value','balance'])),rate:pick(o,['rate','depreciationrate'])};
  const c=findClient(r.client,r.pan);
  if(!c){r.status='bad';r.note='Client not found';return r;}
  if(!r.fy){r.status='bad';r.note='Invalid FY';return r;}
  if(!r.item){r.status='bad';r.note='Item missing';return r;}
  const t=figTarget(c,r);if(t.err){r.status='bad';r.note=t.err;return r;}
  r.status='new';r.note=c.years[r.fy]?'Updates FY '+r.fy:'Creates FY '+r.fy;return r;
}
function figTarget(c,r){
  const sec=r.section,it=normK(r.item);
  const map={trading:{openingstock:'openStock',purchases:'purchases',purchase:'purchases',sales:'sales',sale:'sales',closingstock:'closingStock'},
    capital:{capitalintroduced:'capIntro',additionalcapital:'capIntro',openingcapital:'openCapital',capital:'openCapital',drawings:'drawings',sharecapital:'shareCapital',openingsurplus:'openSurplus',reserves:'openSurplus',reservesandsurplus:'openSurplus',dividend:'dividend'},
    liability:{advancesreceived:'advRecd',advancefromcustomers:'advRecd',securedloans:'secured',secured:'secured',unsecuredloans:'unsecured',unsecured:'unsecured',sundrycreditors:'creditors',creditors:'creditors',dutiesandtaxes:'taxes',taxes:'taxes'},
    asset:{sundrydebtors:'debtors',debtors:'debtors',cashinhand:'cash',cash:'cash',loansandadvances:'advances',advances:'advances'}};
  const S={trading:'trading',directexpense:'direct',direct:'direct',indirectexpense:'indirect',indirect:'indirect',expense:'indirect',income:'income',capital:'capital',liability:'liability',asset:'asset',fixedasset:'fixed',fixedassets:'fixed'}[sec];
  if(!S)return{err:'Unknown section "'+sec+'"'};
  if(S==='trading'||S==='capital'){if(!map[S][it])return{err:'Unknown item for '+S};return{S,key:map[S][it]};}
  if(S==='liability'){return{S,key:map.liability[it]||null};}
  if(S==='asset'){return{S,key:map.asset[it]||null,bank:/bank/.test(it)};}
  return{S};
}
function upsert(list,name,v){const f=list.find(x=>(x.n||'').trim().toLowerCase()===name.trim().toLowerCase());if(f)f.v=v;else list.push({n:name,v});}
function applyFig(r){
  const c=findClient(r.client,r.pan),t=figTarget(c,r);let y=c.years[r.fy];if(!y){y=blankYear(r.fy,c);c.years[r.fy]=y;}
  if(t.S==='trading')y.trading[t.key]=r.amount;
  else if(t.S==='capital')y.bs[t.key]=r.amount;
  else if(t.S==='direct')upsert(y.trading.direct,r.item,r.amount);
  else if(t.S==='indirect')upsert(y.pl.indirect,r.item,r.amount);
  else if(t.S==='income')upsert(y.pl.income,r.item,r.amount);
  else if(t.S==='liability'){if(t.key)y.bs[t.key]=r.amount;else upsert(y.bs.otherLiab,r.item,r.amount);}
  else if(t.S==='asset'){if(t.key)y.bs[t.key]=r.amount;else if(t.bank)upsert(y.bs.banks,r.item,r.amount);else upsert(y.bs.otherAssets,r.item,r.amount);}
  else if(t.S==='fixed'){let a=y.bs.assets.find(x=>(x.n||'').trim().toLowerCase()===r.item.trim().toLowerCase());if(!a){a=asset(r.item,10);y.bs.assets.push(a);}a.open=r.amount;if(r.rate!=='')a.rate=dnum(r.rate);}
}

function impApply(){
  if(!IMP.rows)return;let msg='';
  if(IMP.tab==='ledger'){ledApply();return;}
  if(IMP.tab==='clients'){
    const upd=$('#impupd')&&$('#impupd').checked;let n=0,u=0;
    IMP.rows.forEach(r=>{
      if(r.status==='new'){const c={id:uid(),name:r.name,trade:r.trade||'',pan:r.pan,type:r.type,address:r.address,signatory:r.signatory,place:r.place,hasTrading:r.hasTrading,years:{},created:Date.now()};
        const y=blankYear(r.fy,c);if(r.openStock&&c.hasTrading)y.trading.openStock=r.openStock;if(r.openCapital){if(kindOf(c)==='prop')y.bs.openCapital=r.openCapital;else if(kindOf(c)==='co')y.bs.shareCapital=r.openCapital;}
        c.years[r.fy]=y;DB.clients.push(c);n++;}
      else if(r.status==='dup'&&upd){const c=findClient(r.name,r.pan);if(c){['address','signatory','place','trade'].forEach(k=>{if(r[k])c[k]=r[k];});if(r.pan&&!c.pan)c.pan=r.pan;c.type=r.type;u++;}}});
    msg=n+' client(s) added'+(u?', '+u+' updated':'');
  }else if(IMP.tab==='figures'){
    let n=0;IMP.rows.forEach(r=>{if(r.status==='new'){applyFig(r);n++;}});msg=n+' figure(s) imported';
  }else{
    const mode=($('input[name=impmode]:checked')||{}).value||'merge';
    if(mode==='replace'){if(!confirm('Replace ALL existing data with the backup?'))return;DB={clients:IMP.backup.clients,settings:Object.assign({firm:''},IMP.backup.settings||{})};}
    else{let add=0,rep=0;IMP.backup.clients.forEach(b=>{const i=DB.clients.findIndex(c=>c.id===b.id||c.name.trim().toLowerCase()===b.name.trim().toLowerCase());if(i>=0){DB.clients[i]=b;rep++;}else{DB.clients.push(b);add++;}});msg=add+' added, '+rep+' replaced';}
    if(mode==='replace')msg='All data replaced ('+DB.clients.length+' clients)';
    UI.cid=null;UI.fy=null;
  }
  save();closeModal();UI.view='clients';render();toast(msg);
}

  showModal('<div class="mbox"><h2>Import / Backup</h2><div class="mtabs">'+tabs.map(t=>'<div class="st '+(t[0]===T?'a':'')+'" data-act="impTab" data-a="'+t[0]+'">'+t[1]+'</div>').join('')+'</div>'+body+'<div class="mfoot"><button class="btn s" data-act="closeModal">Close</button>'+(canApply?'<button class="btn" data-act="impApply">Import</button>':'')+'</div></div>');
}

/* ================= password lock ================= */
const PWKEY='krn_plbs_pw',SESS='krn_plbs_unlocked';let PWMEM=null,failN=0,failUntil=0;
function cyrb(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(16);}
async function hashPw(pw,salt){const s=salt+'|'+pw;try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return 's'+Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}}catch(e){}return 'c'+cyrb(s)+cyrb(s.split('').reverse().join(''));}
const getPW=()=>{try{const v=JSON.parse(localStorage.getItem(PWKEY)||'null');if(v)return v;}catch(e){}return PWMEM;};
const setPW=o=>{PWMEM=o;try{localStorage.setItem(PWKEY,JSON.stringify(o));}catch(e){}};
const isUnlocked=()=>{try{return sessionStorage.getItem(SESS)==='1';}catch(e){return false;}};
const markUnlocked=v=>{try{if(v)sessionStorage.setItem(SESS,'1');else sessionStorage.removeItem(SESS);}catch(e){}};
async function makePW(pw){const salt=uid()+uid();return{salt,hash:await hashPw(pw,salt)};}
async function checkPW(pw){const r=getPW();return !!r&&(await hashPw(pw,r.salt))===r.hash;}
const lkEye='<span class="lkeye" data-act="lockEye">Show</span>';
function showLock(mode){
  const L=$('#lock');
  const foot='<div class="lkfoot">🔒 Your client data stays on this device</div>';
  const head='<div class="lklogo">KRN</div>';
  if(mode==='setup')L.innerHTML='<div><div class="lkcard">'+head+'<h1>Set your password</h1><p>First time here. Choose a password<br>you will use every time you open the portal.</p><div class="lkf"><label>New password</label><div class="lkin"><input id="lk1" type="password" autocomplete="new-password">'+lkEye+'</div></div><div class="lkf"><label>Confirm password</label><div class="lkin"><input id="lk2" type="password" autocomplete="new-password">'+lkEye+'</div></div><div class="lkmsg" id="lkmsg"></div><button class="lkbtn" id="lkgo" data-act="lockSetup">Save &amp; Open Portal</button><div class="lksmall">Minimum 6 characters</div></div>'+foot+'</div>';
  else L.innerHTML='<div><div class="lkcard">'+head+'<h1>KRN Tax Consultancy</h1><p>P&amp;L / Balance Sheet Portal<br>Enter your password to continue</p><div class="lkf"><label>Password</label><div class="lkin" id="lkbox"><input id="lk1" type="password" autocomplete="current-password">'+lkEye+'</div></div><div class="lkmsg" id="lkmsg"></div><button class="lkbtn" id="lkgo" data-act="lockLogin">Unlock</button><div class="lksmall">Forgot password? <b data-act="lockReset">Reset</b></div></div>'+foot+'</div>';
  L.classList.add('on');$('#main').innerHTML='';$('#side').innerHTML='';
  setTimeout(()=>{const i=$('#lk1');if(i)i.focus();},50);
}
function lkMsg(t){const m=$('#lkmsg');if(m)m.textContent=t||'';const b=$('#lkbox');if(b)b.classList.toggle('err',!!t);}
function openApp(){markUnlocked(true);$('#lock').classList.remove('on');$('#lock').innerHTML='';render();syncOnOpen();}
$('#lock').addEventListener('keydown',e=>{if(e.key==='Enter'){const b=$('#lkgo');if(b&&!b.disabled)b.click();}});
$('#lock').addEventListener('input',()=>lkMsg(''));
A.lockEye=(_a,el)=>{const i=el.parentElement.querySelector('input');const show=i.type==='password';i.type=show?'text':'password';el.textContent=show?'Hide':'Show';};
A.lockSetup=async()=>{const a=$('#lk1').value,b=$('#lk2').value;
  if(a.length<6){lkMsg('Password must be at least 6 characters.');return;}
  if(a!==b){lkMsg('The two passwords do not match.');return;}
  setPW(await makePW(a));openApp();toast('Password set');};
A.lockLogin=async()=>{
  const now=Date.now();if(now<failUntil){lkMsg('Too many attempts. Try again in '+Math.ceil((failUntil-now)/1000)+' seconds.');return;}
  if(await checkPW($('#lk1').value)){failN=0;openApp();return;}
  failN++;$('#lk1').value='';$('#lk1').focus();
  if(failN>=5){failUntil=Date.now()+30000;failN=0;lkMsg('Too many attempts. Try again in 30 seconds.');}else lkMsg('Incorrect password. Please try again.');
  const b=$('#lkbox');if(b)b.classList.add('err');};
A.lockNow=()=>{markUnlocked(false);showLock(getPW()?'login':'setup');};
A.lockReset=()=>{
  const t=prompt('Forgot your password?\n\nResetting ERASES all clients stored in this browser and removes the password. Restore from a backup file afterwards if you have one.\n\nType RESET to continue.');
  if(t!=='RESET')return;
  try{localStorage.removeItem(KEY);localStorage.removeItem(PWKEY);localStorage.removeItem(SYNCKEY);localStorage.removeItem(SYNCMETA);}catch(e){}
  SYNC=null;SMETA={sha:null,at:0,dirty:false};PWMEM=null;DB={clients:[],settings:{firm:FIRM}};UI.cid=null;UI.fy=null;UI.view='clients';markUnlocked(false);showLock('setup');};
A.changePw=async()=>{
  const c=$('#pwcur').value,n=$('#pwnew').value,n2=$('#pwnew2').value;
  if(!(await checkPW(c))){toast('Current password is incorrect',1);return;}
  if(n.length<6){toast('New password must be at least 6 characters',1);return;}
  if(n!==n2){toast('New passwords do not match',1);return;}
  setPW(await makePW(n));['pwcur','pwnew','pwnew2'].forEach(i=>{$('#'+i).value='';});toast('Password changed');};

/* ================= GitHub sync (encrypted, private repo) ================= */
const SYNCKEY='krn_plbs_sync',SYNCMETA='krn_plbs_syncmeta';
const lsj=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch(e){return d;}};
const lsw=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
let SYNC=lsj(SYNCKEY,null),SMETA=lsj(SYNCMETA,{sha:null,at:0,dirty:false}),sBusy=false,sTimer=null,SPEND=null,sErrShown=false;
const syncOn=()=>!!(SYNC&&SYNC.repo&&SYNC.token&&SYNC.pass);
const hhmm=()=>new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const saveMeta=()=>lsw(SYNCMETA,SMETA);
const te=new TextEncoder(),td=new TextDecoder();
const u8b64=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);};
const b64u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pass,salt){const k=await crypto.subtle.importKey('raw',te.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function encryptDB(){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await deriveKey(SYNC.pass,salt);
  const plain=JSON.stringify({app:'krn-plbs',version:1,exported:new Date().toISOString(),settings:DB.settings,clients:DB.clients});
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(plain)));
  return JSON.stringify({app:'krn-plbs',v:1,kdf:'PBKDF2-SHA256-200000',cipher:'AES-256-GCM',salt:u8b64(salt),iv:u8b64(iv),data:u8b64(ct),updated:new Date().toISOString()});
}
async function decryptDB(text){
  let o;try{o=JSON.parse(text);}catch(e){throw new Error('The cloud file is not a KRN portal data file.');}
  if(!o||o.app!=='krn-plbs'||!o.data)throw new Error('The cloud file is not a KRN portal data file.');
  try{const key=await deriveKey(SYNC.pass,b64u8(o.salt));const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u8(o.iv)},key,b64u8(o.data));
    const d=JSON.parse(td.decode(pt));if(!d||!Array.isArray(d.clients))throw 0;return d;}
  catch(e){const x=new Error('Wrong passphrase for the cloud data (or the file is damaged).');x.pass=true;throw x;}
}
const ghH=(raw)=>({Authorization:'Bearer '+SYNC.token,Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'});
const ghURL=()=>'https://api.github.com/repos/'+SYNC.repo+'/contents/'+SYNC.path.split('/').map(encodeURIComponent).join('/');
async function ghErr(r){let m='';try{m=(await r.json()).message||'';}catch(e){}
  const e=new Error(r.status===401?'GitHub rejected the token (invalid or expired).':r.status===403?'GitHub refused: the token needs Contents → Read and write on this repository (or you hit a rate limit).':r.status===404?'Repository or file not found, or the token has no access to it.':'GitHub error '+r.status+(m?': '+m:''));e.status=r.status;return e;}
async function ghRepoInfo(){
  const r=await fetch('https://api.github.com/repos/'+SYNC.repo,{headers:ghH(),cache:'no-store'});if(!r.ok)throw await ghErr(r);return r.json();}
async function ghGet(){
  const r=await fetch(ghURL()+'?ref='+encodeURIComponent(SYNC.branch)+'&t='+Date.now(),{headers:ghH(),cache:'no-store'});
  if(r.status===404){await ghRepoInfo();return{missing:true};}
  if(!r.ok)throw await ghErr(r);
  const j=await r.json();let text;
  if(j.content&&j.encoding==='base64'&&j.content.length)text=td.decode(b64u8(j.content.replace(/\s/g,'')));
  else{const r2=await fetch(ghURL()+'?ref='+encodeURIComponent(SYNC.branch)+'&t='+Date.now(),{headers:ghH(true),cache:'no-store'});if(!r2.ok)throw await ghErr(r2);text=await r2.text();}
  return{sha:j.sha,text};
}
async function ghPut(body,sha){
  const r=await fetch(ghURL(),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghH()),
    body:JSON.stringify({message:'KRN portal sync '+new Date().toISOString(),content:u8b64(te.encode(body)),branch:SYNC.branch,sha:sha||undefined})});
  if(r.status===409||r.status===422){const e=new Error('Cloud copy changed while saving.');e.conflict=true;throw e;}
  if(!r.ok)throw await ghErr(r);
  return (await r.json()).content.sha;
}
function syncFail(e){
  if(e&&e.message==='Failed to fetch')e=new Error('No internet connection – data is saved on this device and will sync later.');
  setInd('⚠ Sync problem – saved on this device');
  if(!sErrShown){sErrShown=true;toast('GitHub sync: '+(e&&e.message||e),1);setTimeout(()=>{sErrShown=false;},60000);}
  window.__syncErr=e&&e.message;
}
function syncDirty(){
  if(!syncOn()||SKIPSYNC)return;
  SMETA.dirty=true;saveMeta();clearTimeout(sTimer);sTimer=setTimeout(()=>syncPush(false),4000);
}
function applyRemote(data,sha){
  SKIPSYNC=true;
  DB.clients=data.clients;DB.settings=Object.assign({firm:FIRM},data.settings||{});if(!DB.settings.firm)DB.settings.firm=FIRM;
  saveNow();SKIPSYNC=false;
  SMETA={sha,at:Date.now(),dirty:false};saveMeta();
  if(UI.cid&&!DB.clients.find(c=>c.id===UI.cid)){UI.cid=null;UI.fy=null;UI.view='clients';}
  else if(UI.cid&&UI.fy&&!curYear()){UI.fy=latestFY(curClient());}
  render();setInd('Synced to GitHub ✓ '+hhmm());
}
function mergeData(l,r){
  const out={settings:Object.assign({},r.settings||{},l.settings||{}),clients:[]},rm=new Map((r.clients||[]).map(c=>[c.id,c])),seen=new Set();
  l.clients.forEach(lc=>{seen.add(lc.id);const rc=rm.get(lc.id);if(!rc){out.clients.push(lc);return;}
    const m=JSON.parse(JSON.stringify(lc));
    Object.keys(rc.years||{}).forEach(fy=>{const a=m.years[fy],b=rc.years[fy];if(!a||(b.updated||b.created||0)>(a.updated||a.created||0))m.years[fy]=b;});
    out.clients.push(m);});
  (r.clients||[]).forEach(rc=>{if(!seen.has(rc.id))out.clients.push(rc);});
  return out;
}
async function pushWith(sha){
  const body=await encryptDB();const ns=await ghPut(body,sha);
  SMETA={sha:ns,at:Date.now(),dirty:false};saveMeta();setInd('Synced to GitHub ✓ '+hhmm());
}
async function syncPush(manual){
  if(!syncOn()||sBusy)return;sBusy=true;clearTimeout(sTimer);setInd('Syncing to GitHub…');
  try{
    const rem=await ghGet();
    if(!rem.missing&&rem.sha!==SMETA.sha){const data=await decryptDB(rem.text);SPEND={sha:rem.sha,data};conflictDialog();return;}
    if(!DB.clients.length&&!manual){setInd('Cloud copy kept – nothing to push (no clients here)');return;}
    await pushWith(rem.missing?undefined:rem.sha);
    sErrShown=false;if(manual)toast('Pushed to GitHub');
  }catch(e){if(e.conflict){sBusy=false;return syncOnOpen();}syncFail(e);}
  finally{sBusy=false;}
}
async function syncOnOpen(){
  if(!syncOn()||sBusy)return;sBusy=true;setInd('Checking GitHub…');
  try{
    const rem=await ghGet();
    if(rem.missing){sBusy=false;if(DB.clients.length)return syncPush(true);setInd('Connected – no cloud data yet');return;}
    if(rem.sha===SMETA.sha){if(SMETA.dirty){sBusy=false;return syncPush(false);}setInd('Synced to GitHub ✓ '+hhmm());return;}
    const data=await decryptDB(rem.text);
    if(!SMETA.dirty&&(SMETA.sha||!DB.clients.length)){applyRemote(data,rem.sha);toast('Loaded the latest data from GitHub');return;}
    SPEND={sha:rem.sha,data};conflictDialog();
  }catch(e){syncFail(e);}
  finally{sBusy=false;}
}
function conflictDialog(){
  const r=SPEND.data,nc=(r.clients||[]).length,ny=(r.clients||[]).reduce((s,c)=>s+Object.keys(c.years||{}).length,0);
  showModal('<div class="mbox" style="max-width:520px"><h2>Cloud and this device differ</h2><p class="hint">The GitHub copy has <b>'+nc+'</b> client(s) and <b>'+ny+'</b> financial year(s). This device has <b>'+DB.clients.length+'</b> client(s). Choose which to keep. Nothing is deleted from GitHub: every earlier version stays in the repo history.</p>'+
   '<div style="display:grid;gap:8px;margin-top:10px">'+B('Merge both (recommended)','syncMerge')+B('Use the cloud copy (replace this device)','syncUseCloud',null,'s')+B('Keep this device (overwrite the cloud)','syncUseLocal',null,'s')+'</div><div class="hint" style="margin-top:10px">Merge keeps every client from both sides; for the same client and year the most recently edited one wins. Merge never deletes a client.</div><div class="mfoot"><button class="btn s" data-act="syncLater">Decide later</button></div></div>');
}
A.syncLater=()=>{closeModal();setInd('⚠ Sync paused – resolve in Settings → Sync');};
A.syncUseCloud=()=>{if(!SPEND)return;closeModal();applyRemote(SPEND.data,SPEND.sha);SPEND=null;toast('Loaded the cloud copy');};
A.syncUseLocal=async()=>{if(!SPEND)return;const s=SPEND.sha;SPEND=null;closeModal();sBusy=true;setInd('Syncing to GitHub…');try{await pushWith(s);toast('Cloud copy replaced with this device');}catch(e){syncFail(e);}finally{sBusy=false;}};
A.syncMerge=async()=>{if(!SPEND)return;const s=SPEND.sha,m=mergeData({settings:DB.settings,clients:DB.clients},SPEND.data);SPEND=null;closeModal();
  SKIPSYNC=true;DB.clients=m.clients;DB.settings=Object.assign({firm:FIRM},m.settings);saveNow();SKIPSYNC=false;render();
  sBusy=true;setInd('Syncing to GitHub…');try{await pushWith(s);toast('Merged and synced');}catch(e){syncFail(e);}finally{sBusy=false;}};
A.syncConnect=async()=>{
  const repo=($('#syrepo').value||'').trim().replace(/^https?:\/\/github\.com\//i,'').replace(/\.git$/i,'').replace(/\/$/,''),token=($('#sytoken').value||'').trim(),pass=$('#sypass').value||'';
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){toast('Enter the repository as owner/name, e.g. ANOTHEREARTH-12/KRN-PLBS-data',1);return;}
  if(!token){toast('Paste the access token',1);return;}
  if(pass.length<8){toast('Passphrase must be at least 8 characters',1);return;}
  if(pass!==$('#sypass2').value){toast('The two passphrases do not match',1);return;}
  const prev=SYNC;SYNC={repo,token,pass,branch:'main',path:'krn-plbs-data.json'};
  try{
    const info=await ghRepoInfo();
    if(info.private!==true){SYNC=prev;toast('That repository is PUBLIC. Client data must go in a private repository.',1);return;}
    if(info.permissions&&info.permissions.push===false){SYNC=prev;toast('The token cannot write to this repository (needs Contents: Read and write).',1);return;}
    SYNC.branch=info.default_branch||'main';
  }catch(e){SYNC=prev;toast(e.message==='Failed to fetch'?'No internet connection':e.message,1);return;}
  lsw(SYNCKEY,SYNC);SMETA={sha:null,at:0,dirty:false};saveMeta();toast('Connected to '+repo);render();syncOnOpen();
};
A.syncNow=()=>{if(!syncOn())return;syncOnOpen().then(()=>{if(SMETA.dirty)syncPush(true);});};
A.syncPull=async()=>{if(!syncOn())return;if(!confirm('Replace the data on this device with the GitHub copy?'))return;
  sBusy=true;try{const rem=await ghGet();if(rem.missing){toast('No cloud data yet',1);return;}applyRemote(await decryptDB(rem.text),rem.sha);toast('Loaded from GitHub');}catch(e){syncFail(e);}finally{sBusy=false;}};
A.syncPushForce=async()=>{if(!syncOn())return;
  if(!DB.clients.length&&!confirm('This device has NO clients. Pushing will replace the cloud copy with an empty one. Continue?'))return;
  if(!confirm('Overwrite the GitHub copy with the data on this device?'))return;
  sBusy=true;setInd('Syncing to GitHub…');try{const rem=await ghGet();await pushWith(rem.missing?undefined:rem.sha);toast('Pushed to GitHub');render();}catch(e){syncFail(e);}finally{sBusy=false;}};
A.syncDisconnect=()=>{if(!confirm('Disconnect from GitHub? The token and passphrase are removed from this browser. Your data here and in the cloud stay as they are.'))return;
  SYNC=null;SMETA={sha:null,at:0,dirty:false};try{localStorage.removeItem(SYNCKEY);localStorage.removeItem(SYNCMETA);}catch(e){}setInd('Saved locally ✓ '+hhmm());render();toast('Disconnected');};
function syncCard(){
  if(syncOn())return '<div class="card"><h3>GitHub Sync <small>Encrypted · private repository</small></h3><div class="row" style="grid-template-columns:1fr auto"><div class="lab">Repository</div><b>'+esc(SYNC.repo)+'</b></div><div class="row" style="grid-template-columns:1fr auto"><div class="lab">Last synced</div><b>'+(SMETA.at?new Date(SMETA.at).toLocaleString():'not yet')+'</b></div><div class="row" style="grid-template-columns:1fr auto"><div class="lab">Unsynced changes</div><b>'+(SMETA.dirty?'Yes':'No')+'</b></div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">'+B('↻ Sync now','syncNow')+B('⬇ Pull from GitHub','syncPull',null,'s')+B('⬆ Push (overwrite cloud)','syncPushForce',null,'s')+B('Disconnect','syncDisconnect',null,'r')+'</div><div class="hint">Changes upload automatically a few seconds after you save, and the latest data is fetched each time you open the portal. The file in GitHub is encrypted with your passphrase – without it the data cannot be read, so do not lose it.</div></div>';
  return '<div class="card"><h3>GitHub Sync <small>Encrypted · private repository</small></h3><div class="hint" style="margin:0 0 10px">1) Create a <b>private</b> repository (tick “Add a README”), e.g. <b>KRN-PLBS-data</b>.<br>2) GitHub → Settings → Developer settings → Fine-grained tokens → limit it to that one repository, permission <b>Contents: Read and write</b>.<br>3) Paste the details below. Do this once on each computer.</div>'+
   '<div class="f"><label class="l">Private repository (owner/name)</label><input class="in" id="syrepo" placeholder="ANOTHEREARTH-12/KRN-PLBS-data" autocomplete="off"></div><div class="f"><label class="l">Access token</label><input class="in" id="sytoken" type="password" autocomplete="off" placeholder="github_pat_…"></div>'+
   '<div class="f"><label class="l">Encryption passphrase (min 8 characters)</label><input class="in" id="sypass" type="password" autocomplete="new-password"></div><div class="f"><label class="l">Confirm passphrase</label><input class="in" id="sypass2" type="password" autocomplete="new-password"></div>'+B('Connect & sync','syncConnect')+
   '<div class="hint">Use the same passphrase on every computer. It cannot be recovered. The token and passphrase are stored only in this browser.</div></div>';
}

A.openBilling=()=>{window.open(BILLING_URL,'_blank','noopener');};
/* ================= init ================= */
if(getPW()&&isUnlocked()){render();syncOnOpen();}else showLock(getPW()?'login':'setup');
